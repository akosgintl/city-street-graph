# make neo4j-up CITY=budapest  ->  Browser http://localhost:7474 (neo4j / $NEO4J_PASSWORD, default "citygraph")
services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["${NEO4J_HTTP_PORT:-7474}:7474", "${NEO4J_BOLT_PORT:-7687}:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-citygraph}
      NEO4J_server_directories_import: /import
    volumes:
      - ./out/${CITY:-budapest}/neo4j:/import
      - neo4j-data:/data
volumes:
  neo4j-data:
