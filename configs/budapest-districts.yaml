# Test config for the osm_admin zone source: Budapest districts V-VIII (admin_level 9).
name: Budapest V-VIII
pbf: data/raw/budapest.osm.pbf
bbox: [19.03, 47.47, 19.12, 47.53]
download:                               # citygraph fetch (build fetches a missing PBF): tried in order
  - url: https://download.bbbike.org/osm/bbbike/Budapest/Budapest.osm.pbf
  - url: https://download.geofabrik.de/europe/hungary-latest.osm.pbf
    md5: https://download.geofabrik.de/europe/hungary-latest.osm.pbf.md5
    clip: [18.757, 47.325, 19.414, 47.655]  # = the BBBike extract (shared by all budapest* configs)
network_type: drive

zones:                                  # inside -> outside
  - type: osm_admin
    admin_level: 9
    areas:                              # zone label: OSM name (or a list of alternative names)
      V: V. kerület
      VI: VI. kerület
      VII: VII. kerület
      VIII: VIII. kerület

checks:
  fail_on_error: true

neo4j_params:
  from_streets: [Andrássy út, Teréz körút]
  to_street: Kálvin tér
  ring: null                            # no ring zones in this config
  here: {latitude: 47.4939, longitude: 19.0607}
