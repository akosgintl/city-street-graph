# Central Budapest: Pest rings (Kiskörút, Nagykörút, Hungária krt) + Buda + Margitsziget.
name: Budapest
pbf: data/raw/budapest.osm.pbf          # BBBike "Budapest" extract (or citygraph clip of Geofabrik hungary)
bbox: [18.97, 47.44, 19.14, 47.57]      # load window W S E N (lon/lat); must contain every zone
download:                               # citygraph fetch (build fetches a missing PBF): tried in order
  - url: https://download.bbbike.org/osm/bbbike/Budapest/Budapest.osm.pbf
  - url: https://download.geofabrik.de/europe/hungary-latest.osm.pbf
    md5: https://download.geofabrik.de/europe/hungary-latest.osm.pbf.md5
    clip: [18.757, 47.325, 19.414, 47.655]  # = the BBBike extract (shared by all budapest* configs)
network_type: drive                     # drive | walk | all
include_names: [Széchenyi lánchíd]      # car-free since 2023 (psv/taxi/bike only); kept, flagged restricted=true

river:
  name: Duna                            # waterway=river name; water polygons touching it form the river
  bridge_zone: DANUBE_BRIDGE            # zone given to river-crossing bridge segments

# Zones inside -> outside; zone_order = position. Ring: boundary-road chain between the heads of two
# river bridges on `bank`, preferring the listed street names, closed along the river.
zones:
  - zone: KISKORUT
    type: ring
    ring: Kiskörút
    from: Széchenyi lánchíd
    to: Szabadság híd
    bank: east
    streets: [Széchenyi István tér, József Attila utca, Deák Ferenc tér, Károly körút, Múzeum körút,
              Vámház körút, Fővám tér]
  - zone: NAGYKORUT
    type: ring
    ring: Nagykörút
    from: Margit híd
    to: Petőfi híd
    bank: east
    streets: [Jászai Mari tér, Szent István körút, Teréz körút, Erzsébet körút, József körút, Ferenc körút,
              Boráros tér]
  - zone: HUNGARIA
    type: ring
    ring: Hungária körút
    from: Árpád híd
    to: Rákóczi híd
    bank: east
    streets: [Róbert Károly körút, Hungária körút, Könyves Kálmán körút]
  - zone: BUDA                          # west bank; `via` = anchor intersections (street-name pairs)
    type: ring
    from: Árpád híd
    to: Rákóczi híd
    bank: west
    via:
      - [Váradi utca, Vörösvári út]
      - [Bécsi út, Váradi utca]
      - [Bécsi út, Szépvölgyi út]
      - [Pusztaszeri út, Szépvölgyi út]
      - [Pusztaszeri út, Törökvész út]
      - [Gábor Áron utca, Törökvész út]
      - [Gábor Áron utca, Szilágyi Erzsébet fasor]
      - [Szilágyi Erzsébet fasor, Széll Kálmán tér]
      - [Alkotás utca, Krisztina körút]
      - [Alkotás utca, Hegyalja út]
      - [Budaörsi út, Villányi út]
      - [Karolina út, Villányi út]
      - [Bocskai út, Karolina út]
      - [Bocskai út, Fehérvári út]
      - [Fehérvári út, Hengermalom út]
      - [Budafoki út, Hengermalom út]
    streets: [Flórián tér, Vörösvári út, Váradi utca, Bécsi út, Szépvölgyi út, Pusztaszeri út, Törökvész út,
              Gábor Áron utca, Szilágyi Erzsébet fasor, Széll Kálmán tér, Krisztina körút, Alkotás utca,
              Hegyalja út, Budaörsi út, Villányi út, Karolina út, Bocskai út, Fehérvári út, Hengermalom út,
              Budafoki út, Dombóvári út]
  - type: osm_admin                     # Margaret Island (admin_level 10 "városrész")
    admin_level: 10
    areas: {ISLAND: Margitsziget}

checks:
  fail_on_error: true                   # non-zero exit if a check fails (outputs are still written)
  bridges: [Árpád híd, Margit híd, Széchenyi lánchíd, Erzsébet híd, Szabadság híd, Petőfi híd, Rákóczi híd]
  streets_in_zones:                     # every node on these streets must fall in one of the zones
    Id. Antall József rakpart: [KISKORUT, NAGYKORUT, HUNGARIA]
    Széchenyi rakpart: [KISKORUT, NAGYKORUT, HUNGARIA]
    Jane Haining rakpart: [KISKORUT, NAGYKORUT, HUNGARIA]
    Belgrád rakpart: [KISKORUT, NAGYKORUT, HUNGARIA]
    Közraktár utca: [KISKORUT, NAGYKORUT, HUNGARIA]
    Bem rakpart: [BUDA]
    Szent Gellért rakpart: [BUDA]
    Műegyetem rakpart: [BUDA]
    Döbrentei tér: [BUDA]

render:
  zoom_bbox: [19.040, 47.485, 19.070, 47.505]   # Kiskörút

neo4j_params:                           # used by neo4j/sample_queries.cypher
  from_streets: [Andrássy út, Teréz körút]      # Oktogon
  to_street: Clark Ádám tér
  ring: Nagykörút
  here: {latitude: 47.4939, longitude: 19.0607}  # Astoria
