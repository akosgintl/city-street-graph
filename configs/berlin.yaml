# Whole Berlin as Superblocker builds it (OSMnx graph_from_polygon on the admin polygon, drive, truncate_by_edge).
# UNTESTED (no Berlin data yet). If a name/level does not match, the build stops and lists what it found.
name: Berlin
pbf: data/raw/berlin.osm.pbf
bbox: [13.06, 52.31, 13.79, 52.70]      # load (+ clip) window; must contain the area + 500 m
download:
  - url: https://download.bbbike.org/osm/bbbike/Berlin/Berlin.osm.pbf
  - url: https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf   # Brandenburg incl. Berlin
    md5: https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf.md5
    clip: true
  - url: https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf        # may not reach 500 m past the border
    md5: https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf.md5
network_type: drive
osmnx_compat: true
area: {osm_admin: {name: Berlin, admin_level: 4}}     # city-state (relation 62422)
clip: any

zones:
  - type: osm_admin_auto
    admin_level: 9                      # 12 Bezirke (Ortsteile are 10) - verify once the PBF is here: stats.json -> zones
    order_from: [13.3777, 52.5163]      # Brandenburger Tor (from Alexanderplatz, Friedrichshain-Kreuzberg may come first)
    expect_count: 12

checks:
  fail_on_error: true

render:
  zoom_bbox: [13.360, 52.500, 13.440, 52.540]   # Mitte

neo4j_params:
  from_streets: [Unter den Linden, Friedrichstraße]
  to_street: Karl-Marx-Allee
  ring: null
  here: {latitude: 52.5219, longitude: 13.4132}  # Alexanderplatz
